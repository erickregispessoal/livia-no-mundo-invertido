<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Aventura no Mundo Invertido</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--panel:#1a0f26;--red:#ff2d4d;--pink:#ff7ab8;--txt:#f4e9ff;--gold:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0710;color:var(--txt);font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-size:10px;line-height:1.8;touch-action:manipulation}
#app,#wrap{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;display:flex;justify-content:space-between;color:var(--gold);text-shadow:2px 2px 0 #000;pointer-events:none}
body.cut .hud{display:none}
#dlg,#end{position:absolute;left:8px;right:8px;background:var(--panel);border:4px solid #fff;padding:12px;display:none;cursor:pointer;z-index:20;max-width:560px;margin:0 auto}
#dlg{bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
#dlg b{display:block;color:var(--red);margin-bottom:6px}
#dlg i{display:block;text-align:right;color:var(--gold);animation:bl 1s steps(2) infinite;font-style:normal}
@keyframes bl{50%{opacity:0}}
#end{top:10%;text-align:center;font-size:11px;cursor:default}
#end h2{color:var(--gold);font-size:14px}
.btn{font:inherit;color:#fff;background:var(--red);border:4px solid #fff;box-shadow:3px 3px 0 #000;padding:10px 14px;margin-top:8px;cursor:pointer}
#skip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:25;font-size:8px;padding:6px 8px;margin:0;display:none}
#pad{display:none;position:fixed;z-index:10;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px;user-select:none;-webkit-user-select:none;opacity:.8}
@media (pointer:coarse){body:not(.cut) #pad{display:grid}}
#pad button{font:inherit;font-size:20px;color:#fff;background:#3b1d5a;border:4px solid var(--pink);box-shadow:3px 3px 0 #000;touch-action:none}
#pad button.on{background:var(--red)}
#toast{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 40px);left:50%;transform:translateX(-50%);background:var(--panel);border:3px solid var(--gold);padding:8px 12px;display:none;white-space:nowrap;color:var(--gold)}
.heart{position:fixed;top:100%;font-size:22px;animation:up 4s linear forwards;pointer-events:none;z-index:9}
@keyframes up{to{transform:translateY(-115vh)}}
</style>
</head>

// ==============================

var cv=$("c"),ctx=cv.getContext("2d"),P=6,TS=96,CW=300,CH=300,VW=9,VH=9;

// ---------- sprites ----------

 var s="#f1c9a5",b=function(a,c,w,h,col){R(x+a*u,y+c*u,w*u,h*u,col)},l=f==1?1:0,r=f==2?1:0;
 b(-3,-4,3,4-l,G.pants);b(0,-4,3,4-r,G.pants);b(-3,-1-l,3,1,"#eee");b(0,-1-r,3,1,"#eee");
 b(-3,-9,6,5,G.shirt);b(-5,-9+l,2,3,G.shirt);b(-5,-6+l,2,1,s);b(3,-9+r,2,3,G.shirt);b(3,-6+r,2,1,s);
 b(-3,-15,6,6,s);
 if(d==1)b(-4,-16,8,9,G.hair);
 else{b(-4,-16,8,3,G.hair);
  if(d==0){b(-4,-13,1,7,G.hair);b(3,-13,1,7,G.hair);b(-2,-12,1,1,"#222");b(1,-12,1,1,"#222");b(-1,-10,2,1,"#d98a8a")}
  else if(d==2){b(1,-13,3,7,G.hair);b(-4,-13,1,3,G.hair);b(-2,-12,1,1,"#222")}
  else{b(-4,-13,3,7,G.hair);b(3,-13,1,3,G.hair);b(1,-12,1,1,"#222")}}
 b(2,-16,2,1,"#ffd23f");
}
function villain(x,y,u){var b=function(a,c,w,h,col){R(x+a*u,y+c*u,w*u,h*u,col)};
 b(-6,-14,12,14,"#1a0a24");b(-8,-9,2,7,"#2a1238");b(6,-9,2,7,"#2a1238");b(-4,-15,8,5,"#0a0410");
 b(-3,-12,2,2,"#ff2d4d");b(1,-12,2,2,"#ff2d4d");
 b(-4,-18,8,2,"#ffd23f");b(-4,-20,2,2,"#ffd23f");b(-1,-20,2,2,"#ffd23f");b(2,-20,2,2,"#ffd23f");
 b(-6,-1,3,1,"#000");b(0,-1,3,1,"#000")}
function mon(x,y,u,f){var b=function(a,c,w,h,col){R(x+a*u,y+c*u,w*u,h*u,col)},o=f?1:0;
 b(-4,-9,8,6,"#2b0a3d");b(-3,-13,6,5,"#3a1050");b(-4,-14,2,2,"#5a1a70");b(2,-14,2,2,"#5a1a70");
 b(-2,-11,4,3,"#ff2d4d");b(-2,-11,1,1,"#fff");b(1,-11,1,1,"#fff");
 b(-5,-3,1,3-o,"#1b0628");b(-2,-3,1,2+o,"#1b0628");b(1,-3,1,3-o,"#1b0628");b(4,-3,1,2+o,"#1b0628")}
function kitty(x,y,u){var b=function(a,c,w,h,col){R(x+a*u,y+c*u,w*u,h*u,col)};
 b(-3,-5,6,4,"#fff");b(-2,-8,4,3,"#fff");b(-2,-10,1,2,"#8a8a96");b(1,-10,1,2,"#8a8a96");
 b(-1,-7,1,1,"#3a9bff");b(1,-7,1,1,"#3a9bff");b(0,-6,1,1,"#ff9ab8");b(3,-4,2,1,"#fff");b(4,-6,1,3,"#fff");b(4,-6,1,1,"#8a8a96");b(-3,-1,2,1,"#dcdce6");b(1,-1,2,1,"#dcdce6")}
var CC=["#d94a4a","#4a7ad9","#e0c040","#5ab86a","#c0c0c8","#b05ad9"];
function car(x,y,ax,v,col){var c=ctx;c.save();c.translate(Math.round(x),Math.round(y));c.rotate((ax?Math.PI/2:0)+(v<0?Math.PI:0));
 R(-TS,-.35*TS,2*TS,.7*TS,col);R(-.5*TS,-.28*TS,.9*TS,.56*TS,"rgba(0,0,0,.28)");R(.4*TS,-.24*TS,.14*TS,.48*TS,"#9ad1ff");R(-.62*TS,-.24*TS,.1*TS,.48*TS,"#7aa6cc");
 R(.9*TS,-.3*TS,.1*TS,.14*TS,"#ffe9a0");R(.9*TS,.16*TS,.1*TS,.14*TS,"#ffe9a0");
 [-.7,.4].forEach(function(a){R(a*TS,-.4*TS,.3*TS,.1*TS,"#000");R(a*TS,.3*TS,.3*TS,.1*TS,"#000")});c.restore()}

// ---------- mundo ----------
var lvl,W,H,map,items,mons,cars,houses,gate,cat,vil,px,py,face=0,walk=0,hp=3,inv=0,fl=0,count=0,busy=true,queue=[],cb,cut=0,cutT=0,done=0,k={l:0,r:0,u:0,d:0},t0=0,tm=0,chk=[0,0],nC=0,nV=0,nG=0;
var HR=[8,18],VR=[12,26],deco=[];
function build(n){
 lvl=n;count=0;hp=3;inv=0;deco=[];items=[];mons=[];cars=[];houses=[];gate=cat=vil=null;done=0;nC=nV=nG=0;seed=n*13+5;
 W=40;H=n==1?30:32;map=[];var x,y,i;
 for(y=0;y<H;y++){map[y]=[];for(x=0;x<W;x++)map[y][x]=(x<1||y<1||x>=W-1||y>=H-1)?(n==1?1:2):0}
 if(n==1){
  HR.forEach(function(r){for(x=0;x<W;x++){map[r][x]=3;map[r+1][x]=3}});
  VR.forEach(function(c){for(y=0;y<H;y++){map[y][c]=3;map[y][c+1]=3}});
  var bx=[1,14,28],by=[1,10,20];
  by.forEach(function(yy){bx.forEach(function(xx){var hx=xx+2,hy=yy+1;houses.push([hx,hy,6,3,(xx==14&&yy==1)?5:(xx==1&&yy==10)?6:(xx==14&&yy==20)?7:(hx+hy)%5]);for(y=hy;y<hy+3;y++)for(x=hx;x<hx+6;x++)map[y][x]=4;map[hy+3][hx+2]=6;map[hy+3][hx+3]=7;map[hy+4][hx+2]=6;map[hy+4][hx+3]=7;deco.push({t:"mail",x:hx+4,y:hy+3},{t:"bush",x:hx-1,y:hy+2},{t:"bush",x:hx+6,y:hy+2},{t:"flower",x:hx,y:hy+3},{t:"flower",x:hx+1,y:hy+3},{t:"flower",x:hx+5,y:hy+3},{t:"can",x:hx+6,y:hy+3})})});
  [[0,0],[2,0],[1,1],[0,2],[2,2]].forEach(function(b,i){var tx=bx[b[0]]+4.5,ty=by[b[1]]+5.5;items.push({x:tx,y:ty,got:0,i:i});
   if(i%2==0)mons.push({x:tx-3,y:ty+1,y0:ty+1,a:tx-3,b:tx+3,s:1.6,d:1,ch:0})});
  gate={x:bx[2]+4.5,y:by[1]+5.5};cat={x:6.5,y:15.5};px=3.5;py=15.5;
  var sf=items.concat([gate,cat,{x:px,y:py}]);
  for(y=1;y<H-1;y++)for(x=1;x<W-1;x++)if(map[y][x]==0&&RN()<.09&&!isRoadN(x,y)&&!deco.some(function(d){return d.x==x&&d.y==y})&&!sf.some(function(s){return Math.hypot(x+.5-s.x,y+.5-s.y)<2.2}))map[y][x]=1;
  for(y=1;y<H-1;y++)for(x=1;x<W-1;x++)if(map[y][x]==0&&isRoadN(x,y)&&(x*3+y*5)%11==0)deco.push({t:"lamp",x:x,y:y});
  for(i=0;i<3;i++){HR.forEach(function(r){[0,1].forEach(function(l){cars.push({ax:0,c:r+l+.5,p:i*14+RN()*5,v:(l?-1:1)*(2.2+RN()*1.6),col:CC[(i+l+r)%6]})})});
   VR.forEach(function(c){[0,1].forEach(function(l){cars.push({ax:1,c:c+l+.5,p:i*11+RN()*4,v:(l?-1:1)*(2.2+RN()*1.6),col:CC[(i+l+c)%6]})})})}
 }else{
  [5,10,15,20,25].forEach(function(wy,j){var g=j%2?3:33;for(x=1;x<W-1;x++)if(!(x>=g&&x<g+4))map[wy][x]=2});
  for(y=0;y<3;y++)for(x=14;x<24;x++)map[y][x]=2;
  [[30.5,28.5],[10.5,22.5],[30.5,17.5],[10.5,12.5],[30.5,7.5]].forEach(function(p,i){items.push({x:p[0],y:p[1],got:0,i:i})});
  [[6,9],[11,14],[16,19],[21,24],[26,30]].forEach(function(b){var ys=(b[0]+b[1])/2+.5;
   for(i=0;i<4;i++){var qx=4+Math.floor(RN()*30),qy=b[0]+1+Math.floor(RN()*2);if(!items.some(function(t){return Math.hypot(qx-t.x,qy-t.y)<2.5}))map[qy][qx]=2}
   mons.push({x:20.5,y:ys,y0:ys,a:3,b:36,s:1.4,d:RN()<.5?1:-1,ch:1})});
  mons.push({x:28.5,y:4.2,y0:4.2,a:24,b:36,s:1.4,d:1,ch:1});
  for(i=0;i<80;i++){var ex=1+Math.floor(RN()*38),ey=1+Math.floor(RN()*30);if(map[ey][ex]==0&&!items.some(function(t){return Math.hypot(ex-t.x,ey-t.y)<1.5}))deco.push({t:RN()<.6?"mush":"bone",x:ex,y:ey})}
  vil={x:19,y:4.4};px=3.5;py=28.5;
 }
 chk=[px,py];upd();
}
function isRoadN(x,y){return rd(x-1,y)||rd(x+1,y)||rd(x,y-1)||rd(x,y+1)}
function rd(x,y){return y>=0&&x>=0&&y<H&&x<W&&map[y][x]==3}
function solid(x,y){var tx=Math.floor(x),ty=Math.floor(y);if(tx<0||ty<0||tx>=W||ty>=H)return true;var m=map[ty][tx];return m==1||m==2||m==4}
function free(x,y){var r=.25;return !solid(x-r,y)&&!solid(x+r,y)&&!solid(x-r,y-.3)&&!solid(x+r,y-.3)}
function upd(){$("cnt").textContent=(lvl==1?"📼 ":"💎 ")+count+"/5  "+"❤".repeat(Math.max(0,hp));$("lv").textContent="FASE "+lvl}

// ---------- dialogo ----------
function toast(s){var e=$("toast");e.textContent=s;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2200)}
var dlg=$("dlg");
function say(lines,who,after){busy=true;queue=lines.slice();cb=after;$("who").textContent=who||"";dlg.style.display="block";next()}

dlg.onclick=next;
function start(){build(1);$("end").style.display="none";
 say(["Hawkins, Indiana. Ruas vazias e uma luz vermelha no céu...","O Rei Sombrio levou "+NOME+" para o Mundo Invertido, mas aqui a cidade é uma cópia sinistra de Hawkins!","Atravesse as ruas com cuidado: os carros fantasmas não param! Encontre as 5 fitas VHS 📼 com as memórias de vocês e abra o portal vermelho."],"FASE 1: RUAS DE HAWKINS")}
function hearts(){for(var i=0;i<30;i++)(function(i){setTimeout(function(){var h=document.createElement("div");h.className="heart";h.textContent=["💖","💗","🐱","✨"][i%4];h.style.left=Math.random()*95+"%";document.body.appendChild(h);setTimeout(function(){h.remove()},4200)},i*120)})(i)}
function finish(){done=1;$("fin").textContent=FINAL;$("end").style.display="block";hearts()}
$("re").onclick=function(){startCut(1)};
function hurt(){if(inv>0)return;hp--;inv=1.6;fl=.5;upd();
 if(hp<=0)say(["As sombras te alcançaram!","Mas ninguém desiste de quem ama. Tente de novo!"],"💔",function(){build(lvl)});else{px=chk[0];py=chk[1]}}

function update(dt){
 if(busy||done)return;
 inv=Math.max(0,inv-dt);fl=Math.max(0,fl-dt);
 var dx=k.r-k.l,dy=k.d-k.u,mv=dx||dy;
 if(dx)face=dx<0?2:3;else if(dy)face=dy<0?1:0;
 if(dx&&dy){dx*=.707;dy*=.707}
 var sp=4.4*dt;if(dx&&free(px+dx*sp,py))px+=dx*sp;if(dy&&free(px,py+dy*sp))py+=dy*sp;
 walk=mv?1+(Math.floor(tm*8)%2):0;
 cars.forEach(function(c){c.p+=c.v*dt;var hi=(c.ax?H:W)+2;if(c.p>hi)c.p=-2;if(c.p<-2)c.p=hi;
  var a=c.ax?c.c:c.p,b=c.ax?c.p:c.c;if(Math.abs(px-a)<(c.ax?.5:1.2)&&Math.abs(py-.25-b)<(c.ax?1.2:.5))hurt()});
 mons.forEach(function(m){
  if(m.ch&&Math.abs(py-m.y0)<2.6&&Math.abs(px-m.x)<6){m.d=px>m.x?1:-1;m.x+=m.d*2.4*dt;m.y=Math.max(m.y0-1.1,Math.min(m.y0+1.1,m.y+(py>m.y?1:-1)*1.4*dt))}
  else{m.x+=m.d*m.s*dt;if(m.x>m.b)m.d=-1;if(m.x<m.a)m.d=1}
  if(Math.abs(px-m.x)<.55&&Math.abs(py-m.y)<.7)hurt()});
 items.forEach(function(it){if(!it.got&&Math.hypot(px-it.x,py-it.y)<.8){it.got=1;count++;upd();
  var l=[];
  if(count==5)l.push(lvl==1?"Todas as fitas! O portal vermelho no leste da cidade está se abrindo...":"Todos os cristais! Corra até o castelo no topo!");
  if(count==5)say(l,lvl==1?"📼":"💎");else toast((lvl==1?"📼 Fita ":"💎 Cristal ")+count+"/5 encontrado!")}});
 if(cat){if(Math.hypot(px-cat.x,py-cat.y)<1.6&&!nC){nC=1;
  say(count<5?["Miau! Eu sou a Frida, a gatinha guardiã de Hawkins.","As fitas VHS 📼 estão nos quintais das casas. Faltam "+(5-count)+".","Cuidado com os carros nas ruas e com as sombras nos quintais!"]:["Miau! Você pegou todas as fitas!","Corre até o portal vermelho, no leste da cidade."],"🐱 FRIDA")}else if(Math.hypot(px-cat.x,py-cat.y)>2.6)nC=0}
 houses.forEach(function(h){if(h[4]>4&&!h.s&&Math.hypot(px-(h[0]+3),py-(h[1]+3.6))<1.4){h.s=1;say(SH[h[4]-5][0],SH[h[4]-5][1])}});
 if(gate){if(Math.hypot(px-gate.x,py-gate.y)<1){
  if(count>=5&&!nG){nG=1;say(["O portal vermelho rugiu e se abriu!","Do outro lado: a Floresta Sombria e o castelo do Rei Sombrio.","Cuidado: as Sombras caçam quem entra nos corredores!"],"🌀 PORTAL",function(){startCut(3)})}
  else if(count<5&&!nG){nG=1;say(["O portal está selado.","Faltam "+(5-count)+" fita(s) VHS 📼 pela cidade."],"🌀 PORTAL")}}else nG=0}
 if(vil){if(Math.hypot(px-vil.x,py-vil.y)<2.2&&!nV){nV=1;
  if(count<5)say(["Muahaha! Você não passa daqui, "+NOME+"!","Volte com os 5 cristais de memória..."],"👹 REI SOMBRIO",function(){px=chk[0];py=chk[1]});
  else say(["O quê?! Você juntou todas as memórias?!","Impossível... o amor de vocês é forte demais.","Tá bom, tá bom... eu desisto. Pode ir, "+ELE+" está te esperando."],"👹 REI SOMBRIO",function(){startCut(4)})}else if(Math.hypot(px-vil.x,py-vil.y)>3.5)nV=0}
 var ok=map[Math.floor(py-.1)][Math.floor(px)]!=3;mons.forEach(function(m){if(Math.hypot(px-m.x,py-m.y)<3.5)ok=0});if(ok)chk=[px,py];
}

// ---------- desenho ----------
function tile(m,x,y,sx,sy){
 var h=hs(x,y)%100,g=lvl==1;
 if(m==3){R(sx,sy,TS,TS,"#25252d");
  var vx=VR.some(function(c){return x==c||x==c+1}),hy=HR.some(function(r){return y==r||y==r+1});
